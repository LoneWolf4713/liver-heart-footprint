services:
  - type: web
    name: liver-heart-footprint
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: PYTHON_VERSION
        value: 3.12.7
